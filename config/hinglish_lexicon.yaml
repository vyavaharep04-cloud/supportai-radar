# SupportAI Radar - Hinglish normalization lexicon.
#
# Used ONLY to build the classifier's text view (see supportai/normalizer.py).
# Entity extraction and urgency scoring read the raw text instead.
#
# How matching works
#   * Text is lowercased and stripped of punctuation first, so variants are written
#     in lowercase letters/apostrophes only (no digits, no punctuation, no run of
#     3+ identical letters - those are collapsed before matching).
#   * Whole words only; the longest phrase wins; replacements are never re-scanned.
#   * Every variant must be unique across the file, and every canonical form must
#     survive normalization unchanged. The loader rejects the file otherwise.
#   * Digits, amounts, IDs, URLs and e-mails are protected and never rewritten.
#   * Romanized Hinglish only. Devanagari text passes through unchanged.
#   * Every string is quoted on purpose: bare no/on/off would be read as booleans.
#
# kind is implied by the section: `phrases` = 2+ words, `tokens` = exactly 1 word.
# Rule ids describe the rule; they never reference the issue taxonomy.

version: 1

settings:
  elongation_min_run: 3

phrases:
  # ---- money deducted / charged -------------------------------------------
